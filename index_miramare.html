<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b7285">
<title>Miramare Sea Restaurant | Recensioni</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden;color:#fff;background:#0b7285}
.pagina{position:relative;width:100%;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;padding:18px clamp(18px,6vw,82px) 86px;background:url("./sfondo-beach.png") center/cover no-repeat}
.pagina::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,56,70,.03),rgba(0,74,92,.07) 35%,rgba(0,61,78,.15) 63%,rgba(0,38,52,.37))}
.brand,.centro,.recensione,footer{position:relative;z-index:2}
.brand{justify-self:center;width:min(92vw,500px);margin-top:2px}
.logo{display:block;width:100%;height:auto;object-fit:contain;background:transparent;filter:drop-shadow(0 9px 16px rgba(0,45,58,.38)) drop-shadow(0 0 7px rgba(255,255,255,.14))}
.centro{align-self:center;justify-self:center;width:min(100%,780px);margin-top:-2.5vh;text-align:center}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;transform:translateY(-22px);margin-bottom:2px;color:#fff;font-size:1.04rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 8px rgba(0,52,67,.88)}
.eyebrow::before,.eyebrow::after{content:"";width:46px;height:2px;background:linear-gradient(90deg,transparent,rgba(174,239,244,.96))}
.eyebrow::after{transform:scaleX(-1)}
.messaggio-box{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(145deg,rgba(4,93,113,.62),rgba(13,151,169,.43));border:1px solid rgba(191,244,247,.34);box-shadow:0 15px 36px rgba(0,42,55,.32),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.messaggio-box::before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(214,253,255,.82),transparent)}
.messaggio{position:relative;z-index:2;margin:0;padding:clamp(22px,3.3vw,36px);color:#fff;font-size:clamp(1.28rem,3.2vw,2.1rem);line-height:1.32;text-shadow:0 2px 7px rgba(0,46,60,.62)}
.recensione{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:clamp(44px,7vh,76px)}
.bottone-google{position:relative;min-width:min(86vw,350px);height:72px;padding:0 42px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(222,253,255,.98);border-radius:17px;background:linear-gradient(180deg,#42d3df 0%,#0da5b6 48%,#087b91 100%);color:#fff;box-shadow:0 18px 40px rgba(0,48,65,.38),0 0 24px rgba(69,218,229,.28),inset 0 1px 0 rgba(255,255,255,.64);font-size:clamp(1.32rem,3vw,1.65rem);font-weight:800;text-decoration:none;text-shadow:0 2px 5px rgba(0,65,80,.42);-webkit-tap-highlight-color:transparent;transition:transform .2s ease}
.bottone-google:active{transform:scale(.97)}
.bottone-google::before{content:"";position:absolute;top:-35%;left:-140px;width:92px;height:175%;transform:rotate(17deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.82),rgba(177,248,250,.38),transparent);filter:blur(1px);animation:riflessoMare 5.8s ease-in-out infinite;z-index:2;pointer-events:none}
.bolla{position:absolute;display:block;border-radius:50%;background:rgba(222,253,255,.96);box-shadow:0 0 5px rgba(255,255,255,.96),0 0 11px rgba(134,238,245,.76);opacity:0;z-index:3;pointer-events:none}
.b1{width:5px;height:5px;left:14%;bottom:21%;animation:bolla1 5.1s ease-in-out infinite}
.b2{width:7px;height:7px;right:15%;bottom:19%;animation:bolla2 5.9s ease-in-out infinite 1.6s}
.b3{width:4px;height:4px;right:29%;top:22%;animation:bolla3 6.4s ease-in-out infinite 3.1s}
.testo-bottone{position:relative;z-index:5}
.stelle{color:#ffd65a;font-size:clamp(2.1rem,5vw,2.8rem);letter-spacing:.14em;line-height:1;text-shadow:0 0 7px rgba(255,214,90,.82),0 0 20px rgba(255,248,214,.25),0 4px 10px rgba(0,51,67,.38)}
footer{position:absolute;right:clamp(20px,6vw,82px);bottom:30px;color:rgba(255,255,255,.94);font-size:1rem;text-align:right;text-shadow:0 2px 8px rgba(0,48,62,.86)}
footer strong{color:#fff;font-size:1.12rem;font-weight:800}
@keyframes riflessoMare{0%,58%{left:-140px;opacity:0}64%{opacity:.24}73%{opacity:.88}89%,100%{left:115%;opacity:0}}
@keyframes bolla1{0%,22%{transform:translateY(7px) scale(.2);opacity:0}36%{transform:translateY(0) scale(1);opacity:.92}50%{transform:translateY(-9px) scale(.45);opacity:0}100%{opacity:0}}
@keyframes bolla2{0%,30%{transform:translateY(8px) scale(.2);opacity:0}43%{transform:translateY(0) scale(1);opacity:.82}56%{transform:translateY(-10px) scale(.4);opacity:0}100%{opacity:0}}
@keyframes bolla3{0%,38%{transform:scale(.2);opacity:0}49%{transform:scale(1);opacity:.78}61%{transform:translateY(-6px) scale(.3);opacity:0}100%{opacity:0}}
@media(max-width:600px){
.pagina{min-height:100svh;padding:max(16px,env(safe-area-inset-top)) 18px max(82px,env(safe-area-inset-bottom))}
.brand{width:min(92vw,410px);margin-top:0}
.centro{width:100%;margin-top:-2.5vh}
.eyebrow{transform:translateY(-22px);gap:10px;font-size:.92rem;letter-spacing:.11em}
.eyebrow::before,.eyebrow::after{width:30px}
.messaggio-box{border-radius:21px}
.messaggio{padding:21px 20px;font-size:clamp(1.2rem,5vw,1.48rem);line-height:1.32}
.recensione{gap:16px;margin-bottom:44px}
.bottone-google{width:min(88vw,345px);min-width:0;height:66px;padding:0 24px;font-size:1.31rem;border-radius:16px}
.stelle{font-size:clamp(2rem,8vw,2.55rem)}
footer{right:18px;bottom:max(27px,env(safe-area-inset-bottom));font-size:.9rem}
footer strong{font-size:1rem}}
@media(max-width:600px) and (max-height:720px){
.brand{width:min(80vw,350px)}
.centro{margin-top:-1vh}
.eyebrow{transform:translateY(-14px);font-size:.81rem}
.messaggio{padding:16px 18px;font-size:1.07rem}
.recensione{gap:10px;margin-bottom:34px}
.bottone-google{height:58px;font-size:1.2rem}
.stelle{font-size:2rem}}
@media(prefers-reduced-motion:reduce){.bottone-google::before,.bolla{animation:none}}
</style>
</head>
<body>
<main class="pagina">
<div class="brand">
<img id="logo" class="logo" src="./logo.png" alt="Miramare Sea Restaurant">
</div>

<section class="centro">
<div class="eyebrow">La tua opinione conta</div>
<div class="messaggio-box">
<p class="messaggio">Il tuo feedback ci aiuta a fare sempre meglio. Dicci la tua! Bastano 2 secondi!</p>
</div>
</section>

<section class="recensione">
<a id="bottoneGoogle" class="bottone-google"
href="https://search.google.com/local/writereview?placeid=ChIJ9f972rXrGRMRpevPbYdyOXU"
target="_blank" rel="noopener noreferrer" aria-label="Lascia una recensione Google">
<span class="bolla b1"></span>
<span class="bolla b2"></span>
<span class="bolla b3"></span>
<span class="testo-bottone">Recensione Google</span>
</a>
<div class="stelle" aria-label="5 stelle">★★★★★</div>
</section>

<footer>Powered by <strong>Tapreputa</strong></footer>
</main>

<script>
const configurazione={
logo:"./logo.png",
nomeAttivita:"Miramare Sea Restaurant",
linkRecensioni:"https://search.google.com/local/writereview?placeid=ChIJ9f972rXrGRMRpevPbYdyOXU"
};
const logo=document.getElementById("logo");
const bottone=document.getElementById("bottoneGoogle");
document.title=configurazione.nomeAttivita+" | Recensioni";
logo.src=configurazione.logo;
logo.alt=configurazione.nomeAttivita;
bottone.href=configurazione.linkRecensioni;
</script>
</body>
</html>
