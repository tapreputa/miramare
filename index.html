<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Pagina recensioni</title>

  <style>

    :root {
      --oro: #ffc107;
      --testo: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--testo);
    }

    .pagina {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      overflow: hidden;

      padding:
        22px
        clamp(20px, 6vw, 86px)
        86px;

      background-image: url("./sfondo-beach.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .brand {
      position: relative;
      justify-self: center;

      width: min(61vw, 335px);

      z-index: 2;
      isolation: isolate;
    }

    .brand::before {
      content: "";

      position: absolute;
      inset: 15% 10%;

      z-index: -1;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.20) 0%,
          rgba(255, 255, 255, 0.08) 38%,
          transparent 75%
        );

      filter: blur(22px);
    }

    .logo {
      display: block;

      width: 100%;
      height: auto;

      -webkit-mask-image:
        radial-gradient(
          ellipse 78% 75% at center,
          #000 42%,
          rgba(0, 0, 0, 0.98) 58%,
          rgba(0, 0, 0, 0.72) 72%,
          rgba(0, 0, 0, 0.30) 84%,
          transparent 100%
        );

      mask-image:
        radial-gradient(
          ellipse 78% 75% at center,
          #000 42%,
          rgba(0, 0, 0, 0.98) 58%,
          rgba(0, 0, 0, 0.72) 72%,
          rgba(0, 0, 0, 0.30) 84%,
          transparent 100%
        );

      filter:
        drop-shadow(
          0 10px 22px rgba(0, 0, 0, 0.22)
        );

      mix-blend-mode: normal;
    }

    .centro {
      position: relative;

      z-index: 2;

      align-self: center;
      justify-self: center;

      width: min(100%, 780px);

      margin-top: -5vh;

      text-align: center;
    }

    .eyebrow {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      transform: translateY(-24px);

      margin-bottom: 2px;

      color: #ffffff;

      font-size: 1.12rem;

      font-weight: 800;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      white-space: nowrap;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.85),
        0 0 16px rgba(0, 0, 0, 0.32);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";

      width: 48px;
      height: 2px;

      flex-shrink: 1;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.95)
        );
    }

    .eyebrow::after {
      transform: scaleX(-1);
    }

    .messaggio-box {
      position: relative;

      border-radius: 25px;

      background:
        rgba(0, 0, 0, 0.46);

      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.26);

      overflow: hidden;
    }

    .messaggio {
      position: relative;

      margin: 0;

      padding:
        clamp(23px, 3.3vw, 37px);

      color: #ffffff;

      font-size:
        clamp(1.3rem, 3.2vw, 2.15rem);

      line-height: 1.32;

      letter-spacing: 0.01em;

      text-shadow:
        0 2px 7px rgba(0, 0, 0, 0.5);
    }

    .recensione {
      position: relative;

      z-index: 2;

      justify-self: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 19px;

      margin-bottom:
        clamp(44px, 7vh, 78px);
    }

    .bottone-google {
      position: relative;

      min-width:
        min(86vw, 340px);

      padding:
        22px 42px;

      border: none;
      border-radius: 16px;

      background: #ffffff;

      color: #16191e;

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.72);

      font-size:
        clamp(1.35rem, 3vw, 1.65rem);

      font-weight: 800;

      letter-spacing: 0.02em;

      text-align: center;
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }

    .bottone-google:active {
      transform: scale(0.98);
    }

    .stelle {
      position: relative;

      color: var(--oro);

      font-size:
        clamp(2.1rem, 5vw, 2.8rem);

      letter-spacing: 0.14em;

      line-height: 1;

      text-shadow:
        0 0 8px rgba(255, 193, 7, 0.70),
        0 0 22px rgba(255, 193, 7, 0.34),
        0 4px 10px rgba(0, 0, 0, 0.40);
    }

    footer {
      position: absolute;

      z-index: 2;

      right:
        clamp(20px, 6vw, 86px);

      bottom: 30px;

      color: rgba(255, 255, 255, 0.92);

      font-size: 1rem;

      font-weight: 500;

      letter-spacing: 0.03em;

      text-align: right;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.85);
    }

    footer strong {
      color: #ffffff;

      font-size: 1.12rem;

      font-weight: 800;
    }

    @media
    (max-width: 600px)
    and
    (orientation: portrait) {

      .pagina {
        min-height: 100svh;

        padding:
          max(18px, env(safe-area-inset-top))
          18px
          max(82px, env(safe-area-inset-bottom));

        background-position: center center;
      }

      .brand {
        width:
          min(61vw, 285px);
      }

      .centro {
        width: 100%;
        margin-top: -5vh;
      }

      .eyebrow {
        transform: translateY(-32px);

        margin-bottom: -4px;

        gap: 10px;

        font-size: 1rem;

        font-weight: 800;

        letter-spacing: 0.13em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 38px;
        height: 2px;
      }

      .messaggio-box {
        border-radius: 21px;
      }

      .messaggio {
        padding:
          21px 20px;

        font-size:
          clamp(
            1.20rem,
            5vw,
            1.48rem
          );

        line-height: 1.32;
      }

      .recensione {
        gap: 16px;

        margin-bottom: 44px;
      }

      .bottone-google {
        width:
          min(88vw, 340px);

        min-width: 0;

        padding:
          19px 24px;

        font-size: 1.34rem;
      }

      .stelle {
        font-size:
          clamp(
            2rem,
            8vw,
            2.55rem
          );
      }

      footer {
        right: 18px;

        bottom:
          max(
            27px,
            env(safe-area-inset-bottom)
          );

        font-size: 0.90rem;
      }

      footer strong {
        font-size: 1rem;
      }
    }

    @media
    (max-width: 600px)
    and
    (max-height: 720px)
    and
    (orientation: portrait) {

      .pagina {
        padding-top: 12px;
      }

      .brand {
        width:
          min(48vw, 220px);
      }

      .centro {
        margin-top: -2vh;
      }

      .eyebrow {
        transform: translateY(-20px);

        margin-bottom: 0;

        font-size: 0.88rem;

        letter-spacing: 0.11em;
      }

      .messaggio {
        padding: 16px 18px;

        font-size: 1.08rem;
      }

      .recensione {
        gap: 10px;

        margin-bottom: 35px;
      }

      .bottone-google {
        padding: 15px 26px;

        font-size: 1.22rem;
      }

      .stelle {
        font-size: 2rem;
      }

      footer {
        bottom: 22px;

        font-size: 0.82rem;
      }

      footer strong {
        font-size: 0.90rem;
      }
    }

  </style>

</head>

<body>

  <script>

    const configurazione = {

      logo:
        "./logo.png",

      nomeAttivita:
        "Miramare Sea Restaurant",

      linkRecensioni:
        "https://search.google.com/local/writereview?placeid=ChIJ9f972rXrGRMRpevPbYdyOXU"

    };

  </script>


  <main
    class="pagina"
    id="pagina"
  >

    <div class="brand">

      <img
        id="logo"
        class="logo"
        src=""
        alt=""
      >

    </div>


    <section class="centro">

      <div class="eyebrow">
        La tua opinione conta
      </div>

      <div class="messaggio-box">

        <p class="messaggio">
          Il tuo feedback ci aiuta a fare sempre meglio.
          Dicci la tua! Ti bastano 3 secondi!
        </p>

      </div>

    </section>


    <section class="recensione">

      <a
        id="bottone-google"
        class="bottone-google"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Recensione Google
      </a>

      <div
        class="stelle"
        aria-label="Cinque stelle"
      >
        ★★★★★
      </div>

    </section>


    <footer>
      Powered by <strong>Tapreputa</strong>
    </footer>

  </main>


  <script>

    document.title =
      configurazione.nomeAttivita +
      " | Recensioni";

    const logo =
      document.getElementById("logo");

    logo.src =
      configurazione.logo;

    logo.alt =
      configurazione.nomeAttivita;

    const bottoneGoogle =
      document.getElementById(
        "bottone-google"
      );

    bottoneGoogle.href =
      configurazione.linkRecensioni;

  </script>

</body>

</html>
