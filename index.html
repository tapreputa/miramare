<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Pagina recensioni</title>

  <style>
    :root {
      --oro: #ffc107;
      --testo: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--testo);
    }

    .pagina {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      overflow: hidden;

      padding:
        22px
        clamp(20px, 6vw, 86px)
        86px;

      background-image: url("./sfondo-beach.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .brand {
      position: relative;
      justify-self: center;
      width: min(61vw, 335px);
      z-index: 2;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      filter: none;
      mix-blend-mode: normal;
    }

    .centro {
      position: relative;
      z-index: 2;

      align-self: center;
      justify-self: center;

      width: min(100%, 780px);

      margin-top: -2vh;

      text-align: center;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-bottom: 18px;

      color: #ffffff;

      font-size: 0.72rem;
      font-weight: 700;

      letter-spacing: 0.22em;
      text-transform: uppercase;

      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";

      width: 44px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.95)
        );
    }

    .eyebrow::after {
      transform: scaleX(-1);
    }

    .messaggio-box {
      position: relative;

      border-radius: 25px;

      background: rgba(0, 0, 0, 0.46);

      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.26);

      overflow: hidden;
    }

    .messaggio {
      position: relative;

      margin: 0;

      padding:
        clamp(23px, 3.3vw, 37px);

      color: #ffffff;

      font-size:
        clamp(1.3rem, 3.2vw, 2.15rem);

      line-height: 1.32;
      letter-spacing: 0.01em;

      text-shadow:
        0 2px 7px rgba(0, 0, 0, 0.5);
    }

    .recensione {
      position: relative;

      z-index: 2;

      justify-self: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 19px;

      margin-bottom:
        clamp(44px, 7vh, 78px);
    }

    .bottone-google {
      position: relative;

      min-width:
        min(82vw, 312px);

      padding:
        22px 62px;

      border: none;
      border-radius: 16px;

      background: #ffffff;

      color: #16191e;

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.72);

      font-size:
        clamp(1.4rem, 3vw, 1.7rem);

      font-weight: 800;

      letter-spacing: 0.03em;

      text-align: center;
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }

    .bottone-google:active {
      transform: scale(0.98);
    }

    .stelle {
      position: relative;

      color: var(--oro);

      font-size:
        clamp(2.1rem, 5vw, 2.8rem);

      letter-spacing: 0.14em;

      line-height: 1;

      text-shadow:
        0 0 8px rgba(255, 193, 7, 0.70),
        0 0 22px rgba(255, 193, 7, 0.34),
        0 4px 10px rgba(0, 0, 0, 0.40);
    }

    footer {
      position: absolute;

      z-index: 2;

      right:
        clamp(20px, 6vw, 86px);

      bottom: 18px;

      color: rgba(255, 255, 255, 0.82);

      font-size: 0.92rem;

      letter-spacing: 0.04em;

      text-align: right;

      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.75);
    }

    footer strong {
      color: #ffffff;

      font-size: 1rem;

      font-weight: 700;
    }

    @media
    (max-width: 600px)
    and
    (orientation: portrait) {

      .pagina {
        min-height: 100svh;

        padding:
          max(18px, env(safe-area-inset-top))
          18px
          max(76px, env(safe-area-inset-bottom));

        background-position: center center;
      }

      .brand {
        width:
          min(61vw, 285px);
      }

      .centro {
        width: 100%;
        margin-top: -1vh;
      }

      .eyebrow {
        margin-bottom: 14px;

        gap: 9px;

        font-size: 0.68rem;

        letter-spacing: 0.18em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 32px;
      }

      .messaggio-box {
        border-radius: 21px;
      }

      .messaggio {
        padding: 21px 20px;

        font-size:
          clamp(
            1.20rem,
            5vw,
            1.48rem
          );

        line-height: 1.32;
      }

      .recensione {
        gap: 16px;
        margin-bottom: 44px;
      }

      .bottone-google {
        width:
          min(82vw, 312px);

        min-width: 0;

        padding: 19px 36px;

        font-size: 1.42rem;
      }

      .stelle {
        font-size:
          clamp(
            2rem,
            8vw,
            2.55rem
          );
      }

      footer {
        right: 18px;

        bottom:
          max(
            14px,
            env(safe-area-inset-bottom)
          );

        font-size: 0.74rem;
      }

      footer strong {
        font-size: 0.82rem;
      }
    }

    @media
    (max-width: 600px)
    and
    (max-height: 720px)
    and
    (orientation: portrait) {

      .pagina {
        padding-top: 12px;
      }

      .brand {
        width:
          min(48vw, 220px);
      }

      .centro {
        margin-top: 0;
      }

      .eyebrow {
        margin-bottom: 9px;
      }

      .messaggio {
        padding: 16px 18px;
        font-size: 1.08rem;
      }

      .recensione {
        gap: 10px;
        margin-bottom: 35px;
      }

      .bottone-google {
        padding: 15px 38px;
        font-size: 1.25rem;
      }

      .stelle {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <script>
    const configurazione = {
      logo: "./logo.png",
      nomeAttivita: "Miramare Sea Restaurant",
      linkRecensioni: "https://search.google.com/local/writereview?placeid=ChIJ0dDdYjPqGRMRM64sgFVBjLE"
    };
  </script>

  <main class="pagina" id="pagina">

    <div class="brand">
      <img
        id="logo"
        class="logo"
        src=""
        alt=""
      >
    </div>

    <section class="centro">

      <div class="eyebrow">
        La tua opinione conta
      </div>

      <div class="messaggio-box">
        <p class="messaggio">
          La tua esperienza per noi conta, lascia una recensione.
        </p>
      </div>

    </section>

    <section class="recensione">

      <a
        id="bottone-google"
        class="bottone-google"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Google
      </a>

      <div
        class="stelle"
        aria-label="Cinque stelle"
      >
        ★★★★★
      </div>

    </section>

    <footer>
      Progetto e sviluppo by <strong>TAPREPUTA</strong>
    </footer>

  </main>

  <script>
    document.title =
      configurazione.nomeAttivita + " | Recensioni";

    const logo =
      document.getElementById("logo");

    logo.src =
      configurazione.logo;

    logo.alt =
      configurazione.nomeAttivita;

    const bottoneGoogle =
      document.getElementById("bottone-google");

    bottoneGoogle.href =
      configurazione.linkRecensioni;
  </script>

</body>

</html>
